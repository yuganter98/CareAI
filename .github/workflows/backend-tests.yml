name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Tests mock the LLM, DB and embedding model, so the heavy
      # sentence-transformers/torch stack is skipped to keep CI fast.
      - name: Install dependencies
        run: |
          grep -v '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest pytest-asyncio httpx
      - name: Run pytest
        run: python -m pytest -q
